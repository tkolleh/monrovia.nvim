name: Tests
on:
  pull_request: ~
  push:
    paths:
      - "lua/**"
      - "test/**"
    branches:
      - main

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    # Nightly tracks a moving target: it may document highlight groups that do
    # not exist in the supported release yet, which group_spec correctly reports
    # as uncovered. Surface that as a signal without blocking merges.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: stable
            experimental: false
          - tag: nightly
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: MunifTanjim/setup-neovim-action@v1
        with:
          tag: ${{ matrix.tag }}

      - name: Install plenary
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim test/plenary

      - name: Run tests
        run: |
          nvim --version
          [ ! -d test ] && exit 0
          nvim --headless --noplugin -u test/minimal_init.vim -c "PlenaryBustedDirectory ./test/monrovia { minimal_init = './test/minimal_init.vim', sequential = true}"
